<app-auth-page
  title="Iniciar sesión"
  altText="¿Todavía no tienes una cuenta?"
  altLink="/sign-up"
  altLinkLabel="Crear una cuenta"
>
  <form (submit)="loginUser($event)" class="auth-form">
    <app-auth-field label="Correo electrónico" icon="email" type="email" [field]="loginForm.email">
    </app-auth-field>

    <app-auth-field label="Contraseña" icon="lock" type="password" [field]="loginForm.password">
    </app-auth-field>

    @if (serverErrors().length > 0) {
      <div class="server-errors">
        @for (err of serverErrors(); track err) {
          <div class="server-error-msg">
            {{ err }}
          </div>
        }
      </div>
    }
    <button class="btn btn--primary" type="submit">Iniciar sesión</button>
  </form>
</app-auth-page>
